name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend – testy
    runs-on: ubuntu-latest

    # Baza danych do testów integracyjnych, uruchamiana obok testów
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Te same zmienne, które lokalnie są w pliku .env
    env:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: test
      POSTGRES_DB: portfolio
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET: tylko-do-testow-w-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalacja zależności
        run: pip install -r backend/requirements-dev.txt
      - name: Testy
        run: pytest backend -v

  frontend:
    name: Frontend – lint i budowanie
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Budowanie (w tym sprawdzenie typów TypeScript)
        run: npm run build

  docker:
    name: Obrazy Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-backend ./backend
      - run: docker build -t portfolio-frontend ./frontend