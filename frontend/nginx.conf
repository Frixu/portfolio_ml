server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Zapytania do API przekazujemy do backendu (bez prefiksu /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Każdy inny adres (np. /portfolios/1) obsługuje aplikacja React
    location / {
        try_files $uri $uri/ /index.html;
    }
}